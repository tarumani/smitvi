name: Hub digest email

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://smitvi.com/api/cron/hub-digest"
