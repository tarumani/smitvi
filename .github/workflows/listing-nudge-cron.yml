name: Listing nudge email

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger listing nudge cron
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://smitvi.com/api/cron/listing-nudge"
